<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronome Pro</title>
    <!-- Manifeste PWA externe (voir manifest.json) — un data: URI inline est
         géré de façon inégale par Safari iOS pour "Ajouter à l'écran d'accueil" ;
         un fichier séparé est plus fiable sur la plateforme visée. -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffc107">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #212121;
            --text-color: #f5f5f5;
            --accent-color: #ffc107;
            --secondary-color: #424242;
            --strong-color: #ff5252;
            --weak-color: #03a9f4;
            --silent-color: #616161;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: calc(10px + var(--safe-area-top)) 15px calc(15px + var(--safe-area-bottom)) 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        h1 { text-align: center; color: var(--accent-color); margin-top: 0; font-size: 1.5em; }
        /* BPM Input area */
        .bpm-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .bpm-btn {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 1.2em; font-weight: bold;
            cursor: pointer;
        }
        input#bpmInput {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 2em;
            width: 140px;
            text-align: center;
            border-radius: 8px;
            padding: 5px;
        }
        /* Time Signature area */
        .sig-container { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .sig-group { display: flex; align-items: center; gap: 5px; }
        input#numeratorInput {
            background: none; border: 1px solid var(--text-color);
            color: var(--text-color); width: 60px;
            text-align: center; font-size: 1.2em; border-radius: 4px;
            padding: 2px;
        }
        select#denominatorSelect {
            background: var(--secondary-color); color: var(--text-color);
            border: none; border-radius: 4px; padding: 2px; font-size: 1.1em;
        }
        /* Step Grid - Smartphone optimized */
        #grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        .step {
            aspect-ratio: 1;
            background-color: var(--secondary-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .step.s1 { background-color: var(--strong-color); box-shadow: 0 0 10px var(--strong-color); }
        .step.s2 { background-color: var(--weak-color); }
        .step.s0 { background-color: var(--silent-color); }
        .step.active { border: 2px solid white; }
        /* Quick Actions */
        .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .btn-sm {
            background-color: var(--secondary-color); color: var(--text-color);
            border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 0.9em;
        }
        /* Controls and Presets */
        .controls { display: flex; gap: 15px; align-items: center; justify-content: center; }
        #playBtn {
            background-color: var(--accent-color); color: var(--bg-color);
            border: none; border-radius: 50%;
            width: 70px; height: 70px;
            font-size: 2em; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255,193,7,0.4);
        }
        #playBtn.stop { background-color: var(--strong-color); box-shadow: 0 4px 15px rgba(255,82,82,0.4); }
        .presets-container { flex-grow: 1; max-width: 250px; }
        select#presetSelect {
            width: 100%;
            background: var(--secondary-color); color: var(--text-color);
            border: none; border-radius: 4px; padding: 10px; font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>Metronome Pro</h1>
    <div class="bpm-container">
        <button class="bpm-btn" onclick="adjustBPM(-10)">--</button>
        <button class="bpm-btn" onclick="adjustBPM(-1)">-</button>
        <input type="text" id="bpmInput" value="120">
        <button class="bpm-btn" onclick="adjustBPM(1)">+</button>
        <button class="bpm-btn" onclick="adjustBPM(10)">++</button>
    </div>
    <div class="sig-container">
        <div class="sig-group">
            <label for="numeratorInput">Mesure:</label>
            <input type="number" id="numeratorInput" value="4" min="1" max="999">
        </div>
        <div class="sig-group">
            <span>/</span>
            <select id="denominatorSelect">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32">32</option>
                <option value="64">64</option>
                <option value="128">128</option>
            </select>
        </div>
    </div>
    <div id="grid">
        <!-- Grille générée en JS -->
    </div>
    <div class="actions">
        <button class="btn-sm" onclick="resetGrid(1)">Accent / Beat</button>
        <button class="btn-sm" onclick="resetGrid(2)">Tout Faible</button>
        <button class="btn-sm" onclick="resetGrid(0)">Tout Silence</button>
    </div>
    <div class="controls">
        <button id="playBtn">▶</button>

        <div class="presets-container">
            <select id="presetSelect">
                <option value="" disabled selected>Mes Presets</option>
            </select>
            <div style="display:flex; gap: 5px; margin-top: 5px;">
                <button class="btn-sm" style="flex:1" onclick="savePreset()">💾 Sauver</button>
                <button class="btn-sm" style="flex:1" onclick="loadPreset()">📂 Charger</button>
            </div>
        </div>
    </div>
    <script>
        // --- Configuration & États ---
        let audioCtx = null;
        let strongBuffer, weakBuffer; // Buffers d'échantillons pré-chargés
        let isPlaying = false;
        let currentStep = 0;

        let rawBPMString = "120";
        let parsedBPM = 120;
        let numerator = 4;
        let denominator = 4;
        let stepsArray = [1, 2, 2, 2]; // 0=Silence, 1=Strong, 2=Weak
        // Scheduling variables
        let nextNoteTime = 0.0;
        const lookaheadTime = 0.05; // 50ms (planification anticipée)
        const checkIntervalTime = 0.025; // 25ms (fréquence du timer)
        let schedulerTimerId;
        // --- DOM Elements ---
        const bpmInput = document.getElementById('bpmInput');
        const numInput = document.getElementById('numeratorInput');
        const denSelect = document.getElementById('denominatorSelect');
        const gridDiv = document.getElementById('grid');
        const playBtn = document.getElementById('playBtn');
        const presetSelect = document.getElementById('presetSelect');
        // --- Initialisation ---
        window.addEventListener('DOMContentLoaded', () => {
            loadPresetsList(); // Charge la liste des noms
            renderGrid();

            // Écouteurs d'input
            bpmInput.addEventListener('change', updateParameters);
            numInput.addEventListener('change', updateParameters);
            denSelect.addEventListener('change', updateParameters);
            playBtn.addEventListener('click', toggleMetronome);
        });
        // --- Initialisation Audio (Nécessite interaction utilisateur) ---
        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });

            // Synthèse et chargement des sons dans des buffers
            strongBuffer = createClickBuffer(1600, 0.02); // Haut, très court
            weakBuffer = createClickBuffer(800, 0.015);   // Moyen, plus doux
        }
        function createClickBuffer(freq, decay) {
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * 0.1; // 100ms max
            const buffer = audioCtx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                const time = i / sampleRate;
                const envelope = Math.exp(-time / decay);
                const val = Math.sin(2 * Math.PI * freq * time);
                data[i] = val * envelope * (1 - time/(length/sampleRate));
            }
            return buffer;
        }
        function playSound(buffer, time) {
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.7, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + buffer.duration);
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            source.start(time);
        }
        // --- Mise à jour des paramètres & Grille ---
        function updateParameters() {
            // 1. BPM Parsing
            rawBPMString = bpmInput.value.trim().replace(',', '.');
            let matched = false;
            // Mixed fraction: "120 2/3"
            const mixedFracMatch = rawBPMString.match(/^(\d+)\s+([1-9]\d*)\s*\/\s*([1-9]\d*)$/);
            if(mixedFracMatch) {
                const whole = parseInt(mixedFracMatch[1]);
                const num = parseInt(mixedFracMatch[2]);
                const den = parseInt(mixedFracMatch[3]);
                parsedBPM = whole + (num / den);
                matched = true;
            }
            // Simple Fraction: "360/3"
            if(!matched) {
                const simpleFracMatch = rawBPMString.match(/^([1-9]\d*)\s*\/\s*([1-9]\d*)$/);
                if(simpleFracMatch) {
                    parsedBPM = parseInt(simpleFracMatch[1]) / parseInt(simpleFracMatch[2]);
                    matched = true;
                }
            }
            // Decimal/Integer
            if(!matched) {
                const val = parseFloat(rawBPMString);
                if(!isNaN(val) && val > 0 && val < 1000) {
                    parsedBPM = val;
                    matched = true;
                }
            }
            if(!matched) { // Fallback en cas d'erreur
                bpmInput.value = parsedBPM.toFixed(2);
            } else {
                if(isNaN(parseFloat(rawBPMString))) bpmInput.value = parsedBPM.toFixed(2);
            }
            // 2. Mesure
            numerator = parseInt(numInput.value) || 4;
            if(numerator < 1) numerator = 1;
            if(numerator > 999) numerator = 999;
            numInput.value = numerator;

            denominator = parseInt(denSelect.value) || 4;
            // 3. Grid Adjust (préserver l'état s'il y a de la place, compléter)
            adjustStepsArray();
            renderGrid();
        }
        function adjustStepsArray() {
            // Dans ce métronome, bpm = noire (1/4).
            // Total steps = numerator * (denominator / 4)
            let neededSteps = numerator * (denominator / 4);
            if(neededSteps < 1) neededSteps = 1;
            neededSteps = Math.round(neededSteps); // Sécurité
            if (stepsArray.length > neededSteps) {
                stepsArray = stepsArray.slice(0, neededSteps);
            } else while (stepsArray.length < neededSteps) {
                stepsArray.push(0); // Complète avec du silence
            }
        }
        function renderGrid() {
            gridDiv.innerHTML = '';

            // Groupement visuel par beat
            const stepsPerBeat = denominator / 4;
            const containerWidth = gridDiv.clientWidth - 10;
            const columns = Math.min(stepsArray.length, 12);
            gridDiv.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            stepsArray.forEach((val, index) => {
                const cell = document.createElement('div');
                cell.className = `step s${val}`;
                cell.id = `step-${index}`;

                // Marge visuelle pour les groupes
                if(stepsPerBeat >= 1 && (index+1) % stepsPerBeat === 0) {
                    cell.style.marginRight = "6px";
                }
                cell.addEventListener('click', () => cycleStepState(index));
                gridDiv.appendChild(cell);
            });
        }
        function cycleStepState(index) {
            // Cycle: 0(Silence) -> 1(Strong) -> 2(Weak) -> 0
            stepsArray[index] = (stepsArray[index] + 1) % 3;
            renderGrid();
        }
        function resetGrid(state) {
            const stepsPerBeat = denominator / 4;
            stepsArray = stepsArray.map((_, index) => {
                if (state === 1) { // Accent/Beat
                    return (index % stepsPerBeat === 0) ? 1 : 0;
                }
                return state;
            });
            renderGrid();
        }
        function adjustBPM(delta) {
            let newVal = Math.round(parsedBPM) + delta;
            if(newVal < 1) newVal = 1;
            if(newVal > 999) newVal = 999;
            bpmInput.value = newVal;
            updateParameters();
        }
        // --- Scheduler Engine ---
        function toggleMetronome() {
            initAudio(); // Assure l'initialisation au premier clic

            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = '■';
                playBtn.classList.add('stop');

                currentStep = 0;
                nextNoteTime = audioCtx.currentTime;
                // Lance le timer de planification
                schedulerTimerId = setInterval(scheduleNotes, checkIntervalTime * 1000);
            } else {
                playBtn.textContent = '▶';
                playBtn.classList.remove('stop');

                clearInterval(schedulerTimerId);
                // Efface la surbrillance active
                document.querySelectorAll('.step.active').forEach(e => e.classList.remove('active'));
            }
        }
        function scheduleNotes() {
            // Planifie les notes jusqu'à la fin de la fenêtre de lookahead
            while (nextNoteTime < audioCtx.currentTime + lookaheadTime) {
                scheduleNote(currentStep, nextNoteTime);
                advanceNote();
            }
        }
        function advanceNote() {
            // Calcul du temps exact d'un step : bpm est la noire(1/4)
            // stepDuration = (60 / parsedBPM) / (denominator / 4)
            const secondsPerBeat = 60.0 / parsedBPM;
            const stepsPerBeat = denominator / 4;
            const stepDuration = secondsPerBeat / stepsPerBeat;
            nextNoteTime += stepDuration;
            // Prochain index de pas
            currentStep = (currentStep + 1) % stepsArray.length;
        }
        function scheduleNote(stepIndex, time) {
            const state = stepsArray[stepIndex];

            // 1. Play Sound
            if (state === 1) playSound(strongBuffer, time);
            else if (state === 2) playSound(weakBuffer, time);
            // 2. Trigger Visual Flash (dans le thread principal JS au bon moment)
            const flashDelay = (time - audioCtx.currentTime) * 1000;

            setTimeout(() => {
                // S'assure que le métronome tourne toujours avant de flash
                if(!isPlaying) return;
                // Efface le précédent
                document.querySelectorAll('.step.active').forEach(e => e.classList.remove('active'));

                // Active le nouveau
                const cell = document.getElementById(`step-${stepIndex}`);
                if(cell) cell.classList.add('active');
            }, Math.max(0, flashDelay - 10)); // Un peu d'anticipation pour le DOM
        }
        // --- Preset Management ---
        const PRESETS_KEY = 'metronome_pwa_presets';
        function loadPresetsList() {
            const data = localStorage.getItem(PRESETS_KEY);
            const presets = data ? JSON.parse(data) : {};

            presetSelect.innerHTML = '<option value="" disabled selected>Mes Presets</option>';
            Object.keys(presets).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                presetSelect.appendChild(opt);
            });
        }
        function savePreset() {
            let name = prompt("Nom du preset :", `Tempo ${parsedBPM.toFixed(1)} ${numerator}/${denominator}`);
            if(!name) return;
            name = name.trim();
            const presets = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}');
            presets[name] = {
                bpmString: bpmInput.value, // Sauvegarde la chaîne originale (ex: "120 2/3")
                parsedBPM: parsedBPM,
                numerator: numerator,
                denominator: denominator,
                steps: [...stepsArray] // Deep copy
            };
            localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
            loadPresetsList();
            presetSelect.value = name;
            alert("Preset sauvegardé.");
        }
        function loadPreset() {
            const name = presetSelect.value;
            if(!name) return;
            const presets = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}');
            const data = presets[name];
            if(!data) return;
            // Chargement des états
            bpmInput.value = data.bpmString || data.parsedBPM;
            numInput.value = data.numerator;
            denSelect.value = data.denominator;
            stepsArray = data.steps;
            // Application
            if(isPlaying) toggleMetronome(); // Stop si tourne
            updateParameters(); // Reload grid
        }
    </script>
</body>
</html>
