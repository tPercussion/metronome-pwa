<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronome Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffc107">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-variant: #2d2d2d;
            --primary: #ff9800;
            --strong: #ff3d00;
            --weak: #00e5ff;
            --silent: #3a3a3c;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 16px) 16px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .bpm-display-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
        }

        .bpm-input-wrapper {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        input#bpmInput {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--primary);
            color: var(--text);
            font-size: 2.6rem;
            font-weight: 800;
            text-align: center;
            width: 220px;
            outline: none;
        }

        .bpm-subtext {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        .nudge-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-nudge {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--surface-variant);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nudge:active {
            background: var(--surface-variant);
        }

        .sig-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--surface);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .num-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .num-box label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        input#numeratorInput {
            background: var(--surface-variant);
            border: 1px solid transparent;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            width: 60px;
            text-align: center;
            border-radius: 6px;
            padding: 4px;
            outline: none;
        }

        .den-selector {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .den-selector::-webkit-scrollbar { display: none; }

        .den-pill {
            background: var(--surface-variant);
            color: var(--text-dim);
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .den-pill.active {
            background: var(--primary);
            color: #000;
        }

        .matrix-container {
            flex: 1 1 96px;
            min-height: 96px;
            background: var(--surface);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            grid-auto-rows: 36px;
            gap: 6px;
            align-content: start;
            margin-bottom: 10px;
        }

        .step-block {
            border-radius: 6px;
            background: var(--silent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
        }

        .step-block.s1 { background: var(--strong); color: #fff; box-shadow: 0 0 8px rgba(255,61,0,0.5); }
        .step-block.s2 { background: var(--weak); color: #000; }
        .step-block.s0 { background: var(--silent); color: var(--text-dim); }

        .step-block.cursor-active {
            outline: 3px solid #fff;
            transform: scale(1.08);
            z-index: 2;
        }

        .batch-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex: 0 0 auto;
        }

        .btn-batch {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--surface-variant);
            color: var(--text-dim);
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .preset-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex: 0 0 auto;
        }

        select#presetSelect {
            flex: 1;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--surface-variant);
            border-radius: 6px;
            padding: 0 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-preset {
            background: var(--surface-variant);
            color: var(--text);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-play {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255,152,0,0.3);
            flex: 0 0 auto;
        }

        .btn-play.running {
            background: var(--strong);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255,61,0,0.4);
        }

        @media (max-height: 650px) {
            body { padding-top: 8px; padding-bottom: 8px; }
            .bpm-display-group { margin: 3px 0; }
            .nudge-grid { margin-bottom: 6px; }
            .sig-row, .batch-actions { margin-bottom: 6px; }
            .preset-bar { margin-bottom: 8px; }
            .btn-play { padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Metronome Pro</div>
        <div id="flashIndicator" style="width: 12px; height: 12px; border-radius: 50%; background: var(--surface-variant);"></div>
    </div>

    <div class="bpm-display-group">
        <div class="bpm-input-wrapper">
            <input type="text" id="bpmInput" value="120" autocomplete="off" spellcheck="false">
        </div>
        <div class="bpm-subtext" id="bpmSubtext">Résolution : 120.00 BPM</div>
    </div>

    <div class="nudge-grid">
        <button class="btn-nudge" onclick="nudgeBPM(-1)">-1</button>
        <button class="btn-nudge" onclick="nudgeBPM(-0.1)">-0.1</button>
        <button class="btn-nudge" onclick="nudgeBPM(-0.01)">-0.01</button>
        <button class="btn-nudge" onclick="nudgeBPM(0.01)">+0.01</button>
        <button class="btn-nudge" onclick="nudgeBPM(0.1)">+0.1</button>
        <button class="btn-nudge" onclick="nudgeBPM(1)">+1</button>
    </div>

    <div class="sig-row">
        <div class="num-box">
            <label for="numeratorInput">Pas :</label>
            <input type="number" id="numeratorInput" value="4" min="1" max="999">
        </div>
        <div class="den-selector" id="denPills">
            <button class="den-pill" data-val="1">/1</button>
            <button class="den-pill" data-val="2">/2</button>
            <button class="den-pill active" data-val="4">/4</button>
            <button class="den-pill" data-val="8">/8</button>
            <button class="den-pill" data-val="16">/16</button>
            <button class="den-pill" data-val="32">/32</button>
            <button class="den-pill" data-val="64">/64</button>
            <button class="den-pill" data-val="128">/128</button>
        </div>
    </div>

    <div class="matrix-container" id="stepMatrix"></div>

    <div class="batch-actions">
        <button class="btn-batch" onclick="batchSet(1)">Accent 1er</button>
        <button class="btn-batch" onclick="batchSet(2)">Tous Faibles</button>
        <button class="btn-batch" onclick="batchSet(0)">Tous Silences</button>
    </div>

    <div class="preset-bar">
        <select id="presetSelect">
            <option value="" disabled selected>Presets enregistrés</option>
        </select>
        <button class="btn-preset" onclick="savePreset()">Enregistrer</button>
        <button class="btn-preset" onclick="loadPreset()">Charger</button>
        <button class="btn-preset" style="color:var(--strong)" onclick="deletePreset()">✕</button>
    </div>

    <button id="playBtn" class="btn-play">Démarrer</button>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let parsedBPM = 120.0;
        let numerator = 4;
        let denominator = 4;
        let steps = [1, 2, 2, 2]; // 0=Silence, 1=Strong, 2=Weak

        let currentStepIndex = 0;
        let nextNoteTime = 0.0;
        let timerId = null;
        const lookahead = 25.0; // ms
        const scheduleAheadTime = 0.1; // sec

        const bpmInput = document.getElementById('bpmInput');
        const bpmSubtext = document.getElementById('bpmSubtext');
        const numInput = document.getElementById('numeratorInput');
        const denPills = document.querySelectorAll('.den-pill');
        const matrixEl = document.getElementById('stepMatrix');
        const playBtn = document.getElementById('playBtn');
        const presetSelect = document.getElementById('presetSelect');
        const flash = document.getElementById('flashIndicator');

        const STORAGE_KEY = 'metronome_pro_v1';

        function parseBPMString(str) {
            str = str.trim().replace(',', '.');
            const mixedMatch = str.match(/^(\d+)\s+([1-9]\d*)\s*\/\s*([1-9]\d*)$/);
            if (mixedMatch) {
                return parseInt(mixedMatch[1]) + (parseInt(mixedMatch[2]) / parseInt(mixedMatch[3]));
            }
            const fracMatch = str.match(/^([1-9]\d*)\s*\/\s*([1-9]\d*)$/);
            if (fracMatch) {
                return parseInt(fracMatch[1]) / parseInt(fracMatch[2]);
            }
            const val = parseFloat(str);
            return (!isNaN(val) && val > 0 && val <= 999) ? val : 120.0;
        }

        function updateBPMFromInput() {
            parsedBPM = parseBPMString(bpmInput.value);
            bpmSubtext.textContent = `Résolution : ${parsedBPM.toFixed(2)} BPM`;
        }

        function nudgeBPM(delta) {
            parsedBPM = Math.min(999, Math.max(1, parsedBPM + delta));
            bpmInput.value = (Number.isInteger(parsedBPM)) ? parsedBPM : parsedBPM.toFixed(2);
            bpmSubtext.textContent = `Résolution : ${parsedBPM.toFixed(2)} BPM`;
        }

        function syncNumerator() {
            let val = parseInt(numInput.value) || 1;
            val = Math.min(999, Math.max(1, val));
            numInput.value = val;
            numerator = val;

            if (steps.length < numerator) {
                while (steps.length < numerator) steps.push(0);
            } else if (steps.length > numerator) {
                steps = steps.slice(0, numerator);
            }
            renderMatrix();
        }

        function renderMatrix() {
            matrixEl.innerHTML = '';
            steps.forEach((state, i) => {
                const el = document.createElement('div');
                el.className = `step-block s${state}`;
                el.id = `step-node-${i}`;
                el.textContent = i + 1;
                el.onclick = () => {
                    steps[i] = (steps[i] + 1) % 3;
                    renderMatrix();
                };
                matrixEl.appendChild(el);
            });
        }

        function batchSet(mode) {
            if (mode === 1) {
                steps = steps.map((_, i) => (i === 0 ? 1 : 2));
            } else {
                steps = steps.map(() => mode);
            }
            renderMatrix();
        }

        denPills.forEach(pill => {
            pill.onclick = () => {
                denPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                denominator = parseInt(pill.getAttribute('data-val'));
            };
        });

        bpmInput.addEventListener('input', updateBPMFromInput);
        numInput.addEventListener('change', syncNumerator);

        function playTone(time, type) {
            if (type === 0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 1) { // Accent Fort
                osc.frequency.setValueAtTime(1760, time);
                osc.frequency.exponentialRampToValueAtTime(880, time + 0.03);
                gain.gain.setValueAtTime(1.0, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
                osc.start(time);
                osc.stop(time + 0.04);
            } else if (type === 2) { // Temps Faible
                osc.frequency.setValueAtTime(880, time);
                gain.gain.setValueAtTime(0.35, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
                osc.start(time);
                osc.stop(time + 0.025);
            }
        }

        function scheduleStep(stepIdx, time) {
            playTone(time, steps[stepIdx]);

            const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
            setTimeout(() => {
                if (!isPlaying) return;
                document.querySelectorAll('.step-block.cursor-active').forEach(b => b.classList.remove('cursor-active'));
                const cur = document.getElementById(`step-node-${stepIdx}`);
                if (cur) cur.classList.add('cursor-active');

                flash.style.background = steps[stepIdx] === 1 ? 'var(--strong)' : (steps[stepIdx] === 2 ? 'var(--weak)' : 'var(--silent)');
            }, delay);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleStep(currentStepIndex, nextNoteTime);
                const stepSeconds = (60.0 / parsedBPM) * (4.0 / denominator);
                nextNoteTime += stepSeconds;
                currentStepIndex = (currentStepIndex + 1) % steps.length;
            }
            timerId = setTimeout(scheduler, lookahead);
        }

        playBtn.onclick = async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = 'Arrêter';
                playBtn.classList.add('running');
                currentStepIndex = 0;
                nextNoteTime = audioCtx.currentTime + 0.05;
                scheduler();
            } else {
                playBtn.textContent = 'Démarrer';
                playBtn.classList.remove('running');
                clearTimeout(timerId);
                document.querySelectorAll('.step-block.cursor-active').forEach(b => b.classList.remove('cursor-active'));
                flash.style.background = 'var(--surface-variant)';
            }
        };

        function refreshPresets() {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            presetSelect.innerHTML = '<option value="" disabled selected>Presets enregistrés</option>';
            Object.keys(data).forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                presetSelect.appendChild(opt);
            });
        }

        function savePreset() {
            const name = prompt('Nom du preset :', `${bpmInput.value} BPM - ${numerator}/${denominator}`);
            if (!name) return;
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            data[name] = {
                bpmStr: bpmInput.value,
                numerator: numerator,
                denominator: denominator,
                steps: [...steps]
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            refreshPresets();
            presetSelect.value = name;
        }

        function loadPreset() {
            const k = presetSelect.value;
            if (!k) return;
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')[k];
            if (!data) return;

            bpmInput.value = data.bpmStr;
            updateBPMFromInput();
            numerator = data.numerator;
            numInput.value = numerator;
            denominator = data.denominator;

            denPills.forEach(p => {
                if (parseInt(p.getAttribute('data-val')) === denominator) p.classList.add('active');
                else p.classList.remove('active');
            });

            steps = [...data.steps];
            renderMatrix();
        }

        function deletePreset() {
            const k = presetSelect.value;
            if (!k || !confirm(`Supprimer le preset "${k}" ?`)) return;
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            delete data[k];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            refreshPresets();
        }

        updateBPMFromInput();
        renderMatrix();
        refreshPresets();
    </script>
</body>
</html>
